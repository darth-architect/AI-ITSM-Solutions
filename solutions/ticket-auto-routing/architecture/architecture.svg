<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#64748B"/></marker></defs>
<rect width="1180" height="660" fill="#FFFFFF"/>
<text x="40" y="46" font-size="22" font-weight="700" fill="#0F172A">Ticket Auto Routing - system architecture</text>
<text x="40" y="72" font-size="14" fill="#475569">Event-driven, platform-agnostic. Demo: ServiceNow (ITSM) + Aisera (AI orchestration) + Azure OpenAI GPT-5.5</text>
<rect x="40" y="105" width="250" height="410" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
<text x="60" y="132" font-size="15" font-weight="700" fill="#0F172A">ITSM tool</text><text x="60" y="151" font-size="12" fill="#475569">ServiceNow in the demo</text>
<rect x="330" y="105" width="810" height="410" rx="14" fill="#FBFBFF" stroke="#AFA9EC" stroke-width="1.2"/>
<text x="350" y="132" font-size="15" font-weight="700" fill="#0F172A">AI orchestration platform</text><text x="350" y="151" font-size="12" fill="#475569">Aisera in the demo - one linear workflow of small, testable sub flows</text>
<rect x="60" y="175" width="210" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="165.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">New ticket</text>
<text x="165.0" y="216.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">no group, or triage queue</text>
<path d="M165 239 L165 273" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="60" y="275" width="210" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="165.0" y="298.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Async insert rule</text>
<text x="165.0" y="316.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">POST {number, sys_id}</text>
<rect x="60" y="395" width="210" height="92" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
<text x="165.0" y="414.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#27500A">REST API</text>
<text x="165.0" y="432.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">read ticket</text>
<text x="165.0" y="450.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">search resolved history</text>
<text x="165.0" y="468.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">check group, write note</text>
<rect x="360" y="180" width="170" height="72" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="445.0" y="207.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Event handler</text>
<text x="445.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">extract ticket number</text>
<rect x="560" y="180" width="170" height="72" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
<text x="645.0" y="207.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#27500A">Ticket details</text>
<text x="645.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">GET ticket, fresh copy</text>
<rect x="760" y="180" width="170" height="72" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="845.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Gate</text>
<text x="845.0" y="216.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">stop if missing</text>
<text x="845.0" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">or already routed</text>
<rect x="960" y="180" width="170" height="72" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
<text x="1045.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Classify - LLM 1</text>
<text x="1045.0" y="216.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">explicit route, scope,</text>
<text x="1045.0" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">platform, search terms</text>
<path d="M530 216 L558 216" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M730 216 L758 216" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M930 216 L958 216" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M270 307 L310 307 L310 216 L358 216" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="290" y="324" font-size="11" fill="#185FA5" text-anchor="middle">event</text>
<path d="M1045 252 L1045 292 L432 292 L432 328" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="360" y="330" width="116" height="72" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
<text x="418.0" y="357.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#27500A">Scoped search</text>
<text x="418.0" y="375.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3B6D11">own platform only</text>
<rect x="488" y="330" width="116" height="72" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
<text x="546.0" y="357.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3C3489">Rerank - LLM 2</text>
<text x="546.0" y="375.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">relevance, intent</text>
<rect x="616" y="330" width="116" height="72" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="674.0" y="357.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1E293B">Routing score</text>
<text x="674.0" y="375.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475569">confidence, band</text>
<rect x="744" y="330" width="116" height="72" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
<text x="802.0" y="357.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3C3489">Suggest - LLM 3</text>
<text x="802.0" y="375.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">steps from history</text>
<rect x="872" y="330" width="116" height="72" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="930.0" y="357.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1E293B">Decide</text>
<text x="930.0" y="375.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#475569">resolver or desk</text>
<rect x="1000" y="330" width="116" height="72" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
<text x="1058.0" y="357.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#27500A">Update ticket</text>
<text x="1058.0" y="375.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3B6D11">group + work note</text>
<path d="M476 366 L486 366" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M604 366 L614 366" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M732 366 L742 366" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M860 366 L870 366" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M988 366 L998 366" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M330 441 L272 441" fill="none" stroke="#639922" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="360" y="446" font-size="12" font-weight="600" fill="#475569">Legend</text>
<rect x="360" y="458" width="16" height="16" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="384" y="471" font-size="12" fill="#334155">trigger</text>
<rect x="463" y="458" width="16" height="16" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
<text x="487" y="471" font-size="12" fill="#334155">ITSM API call</text>
<rect x="608" y="458" width="16" height="16" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="632" y="471" font-size="12" fill="#334155">gate</text>
<rect x="690" y="458" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
<text x="714" y="471" font-size="12" fill="#334155">LLM call</text>
<rect x="800" y="458" width="16" height="16" rx="3" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="824" y="471" font-size="12" fill="#334155">deterministic code</text>
<text x="360" y="500" font-size="12" fill="#475569">Green steps call the ITSM REST API (dashed line). The event carries identifiers only; content is always re-read.</text>
<rect x="40" y="544" width="4" height="58" fill="#639922"/>
<text x="54" y="560" font-size="14" font-weight="600" fill="#0F172A">Scope before similarity</text>
<text x="54" y="580" font-size="13" fill="#334155">History search is restricted to the resolver groups of the platform found by the</text>
<text x="54" y="598" font-size="13" fill="#334155">scope gate, so an Oracle GST ticket can never outvote an SAP GST ticket.</text>
<rect x="620" y="544" width="4" height="58" fill="#7F77DD"/>
<text x="634" y="560" font-size="14" font-weight="600" fill="#0F172A">LLMs judge, code decides</text>
<text x="634" y="580" font-size="13" fill="#334155">Three prompts give opinions. Group validation, confidence maths and the assign</text>
<text x="634" y="598" font-size="13" fill="#334155">decision run in code; below HIGH, the ticket goes to Service Desk.</text>
<text x="40" y="640" font-size="11" fill="#94A3B8">AI-ITSM-Solutions / solutions/ticket-auto-routing/architecture/architecture.svg</text>
</svg>